# Archon Global Configuration
# See: https://github.com/coleam00/Archon/blob/main/docs/configuration.md

# Bot display name (shown in messages)
# botName: Archon

# Default AI assistant (must match a registered provider, e.g. claude, codex)
# defaultAssistant: claude

# Assistant defaults
# assistants:
#   claude:
#     model: sonnet
#   codex:
#     model: gpt-5.6-sol
#     modelReasoningEffort: medium
#     webSearchMode: disabled
#     additionalDirectories:
#       - /absolute/path/to/other/repo

# Model tier presets (usable as model: small / medium / large)
# tiers:
#   large: { provider: claude, model: opus }
#   medium: { provider: codex, model: gpt-5.6-terra, effort: high }
#   small: { provider: pi, model: minimax-m3 }

# Streaming mode per platform (stream or batch)
# streaming:
#   telegram: stream
#   discord: batch
#   slack: batch

# Concurrency settings
# concurrency:
#   maxConversations: 10

# ---- Factory configuration (galatea-system-stagin) ----
# Coding agent: Claude Code. Only agent installed and signed in on this host.
defaultAssistant: claude

assistants:
  claude:
    model: sonnet

# Model tier presets used by the shared Archon SDLC workflows.
# Starting point from the factory README: Sonnet for small/medium, Opus for large.
tiers:
  small: { provider: claude, model: sonnet }
  medium: { provider: claude, model: sonnet }
  large: { provider: claude, model: opus }
